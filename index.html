<style>

  html, body { margin:0; background:var(--bg); color:var(--text);

  header { position:sticky; top:0; z-index:5; background:var(--bg);

  #q { width:100%; font-size:17px; padding:11px 14px; border-radius:12px; border:1px solid var(--line);

  .tabs { display:flex; gap:8px; margin:0 0 10px; }
  .tab { flex:1; font:inherit; font-size:17px; font-weight:600; padding:10px; border-radius:12px; cursor:pointer;
    background:#262629; color:var(--muted); border:1px solid var(--line); }
  .tab.on { background:var(--gold); color:#1c1c1e; border-color:var(--gold); }
  #q:focus { border-color:var(--gold); }
  main { padding:14px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(3, 1fr); }
  @media (orientation:landscape) { .grid { grid-template-columns:repeat(5, 1fr); } }
  @media (max-width:500px) { .grid { grid-template-columns:repeat(2, 1fr); } }
  .tile { position:relative; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:var(--tile);
    border:1px solid var(--line); cursor:pointer; padding:0; color:var(--text); font:inherit; width:100%; }
  .tile:active { transform:scale(.97); }
  .tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tile .name { position:absolute; left:0; right:0; bottom:0; padding:22px 10px 10px; font-size:16px; font-weight:600;
    line-height:1.2; text-align:left; background:linear-gradient(transparent, rgba(0,0,0,.85)); }
  .tile.nophoto .name { inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    background:none; font-size:19px; padding:12px; }
  .tile .badge { position:absolute; top:8px; right:8px; font-size:11px; padding:3px 7px; border-radius:8px;
    background:var(--gold); color:#1c1c1e; font-weight:700; }
  .section { margin:22px 2px 10px; font-size:13px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }

  #recipe { position:fixed; inset:0; z-index:10; background:var(--bg); overflow-y:auto; overflow-x:hidden;
    display:none; -webkit-overflow-scrolling:touch; }
  #recipe.open { display:block; }
  .rbar { position:sticky; top:0; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line); z-index:2; }
  .back { background:none; border:none; color:var(--gold); font-size:18px; padding:8px 6px; cursor:pointer; }
  .rbody { padding:18px 20px calc(env(safe-area-inset-bottom) + 40px); max-width:900px; margin:0 auto; }
  .rtop { display:flex; gap:20px; align-items:flex-start; }
  .rphoto { width:42%; flex-shrink:0; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:var(--tile); }
  .rphoto img { width:100%; height:100%; object-fit:cover; display:block; }
  @media (orientation:portrait) { .rtop { flex-direction:column; } .rphoto { width:100%; max-width:420px; align-self:center; } }
  h2 { margin:0 0 4px; font-size:30px; }
  .sub { color:var(--muted); font-size:15px; margin-bottom:14px; }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:16px; }
  .meta dt { color:var(--muted); } .meta dd { margin:0; }
  h3 { color:var(--gold); font-size:14px; letter-spacing:.12em; text-transform:uppercase; margin:26px 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:18px; }
  td { padding:10px 4px; border-bottom:1px solid var(--line); }
  td.amt { text-align:right; white-space:nowrap; color:var(--gold); font-weight:600; width:1%; padding-left:16px; }
  ol { padding-left:22px; font-size:17px; line-height:1.55; margin:0; } ol li { margin-bottom:6px; }
  .note { font-size:16px; line-height:1.5; color:#d8d3ca; }
  .src { margin-top:26px; font-size:13px; color:var(--muted); }
</style>

AUTHOR.forEach(r => r.author = true);
const ALL = [...AUTHOR, ...CLASSIC];
const byId = Object.fromEntries(ALL.map(r => [r.id, r]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/ё/g,"е").normalize("NFD").replace(/[̀-ͯ]/g,"");

function tile(r) {
  return `<button class="tile" data-id="${r.id}">
    <img src="img/${r.id}.jpg" alt="" loading="lazy" onerror="this.parentNode.classList.add('nophoto');this.remove()">
    ${r.author ? '<span class="badge">МОЙ</span>' : ''}
    <span class="name">${esc(r.name)}</span></button>`;
}

let tab = "author";
function render() {
  const q = norm(document.getElementById("q").value.trim());
  const hit = r => !q || [r.name, r.ru, r.alt].some(v => norm(v).includes(q));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const a = AUTHOR.filter(hit), c = CLASSIC.filter(hit);
  let h = "";
  if (q) {
    // Поиск идёт по обеим закладкам
    if (a.length) h += `<div class="section">Авторские</div><div class="grid">${a.map(tile).join("")}</div>`;
    if (c.length) h += `<div class="section">Классика</div><div class="grid">${c.map(tile).join("")}</div>`;
  } else {
    const list = tab === "author" ? a : c;
    h = `<div class="grid">${list.map(tile).join("")}</div>`;
  }
  document.getElementById("list").innerHTML = h || '<div class="empty">Ничего не найдено</div>';
}

function openRecipe(id, push = true) {
  const r = byId[id]; if (!r) return;
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  document.getElementById("rbody").innerHTML = `
    <div class="rtop">
      <div class="rphoto" id="rph"><img src="img/${r.id}.jpg" alt="" onerror="document.getElementById('rph').remove()"></div>
      <div>
        <h2>${esc(r.name)}</h2>
        <div class="sub">${esc([r.ru, r.alt, r.author ? "авторский" : ""].filter(Boolean).join(" · "))}</div>
        <dl class="meta">${row("База", r.base)}${row("Бокал", r.glass)}${row("Метод", r.method)}${row("Лёд", r.ice)}${row("Украшение", r.garnish)}</dl>
      </div>
    </div>
    <h3>Ингредиенты</h3>
    <table>${r.ing.map(([n, a]) => `<tr><td>${esc(n)}</td><td class="amt">${esc(a)}</td></tr>`).join("")}</table>
    <h3>Приготовление</h3>
    <ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    ${r.note ? `<h3>Примечания</h3><div class="note">${esc(r.note)}</div>` : ""}
    ${r.src ? `<div class="src">Источник: ${esc(r.src)}</div>` : ""}`;
  const el = document.getElementById("recipe");
  el.classList.add("open"); el.scrollTop = 0;
  if (push) history.pushState({id}, "", "#" + id);
}
function closeRecipe() { document.getElementById("recipe").classList.remove("open"); }

document.getElementById("list").addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (t) openRecipe(t.dataset.id);
});
document.getElementById("back").addEventListener("click", () => {
  if (history.state && history.state.id) history.back(); else { closeRecipe(); history.replaceState(null, "", location.pathname); }
});
window.addEventListener("popstate", e => { e.state && e.state.id ? openRecipe(e.state.id, false) : closeRecipe(); });
document.getElementById("q").addEventListener("input", render);
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (b) { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }
});

render();
if (location.hash.length > 1 && byId[location.hash.slice(1)]) openRecipe(location.hash.slice(1), false);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
